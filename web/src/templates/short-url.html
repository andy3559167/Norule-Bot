<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Short URL</title>
  <link rel="stylesheet" href="/web/app.css" />
</head>
<body class="short-url-page">
<main class="short-url-container">
  <header class="short-url-header">
    <a class="short-url-brand" href="/" aria-label="NoRule URL home">
      <span class="short-url-brand-mark">N</span>
      <span>NoRule URL</span>
    </a>
    <label class="short-url-language" for="uiLangSelect">
      <span id="uiLangLabel">Language</span>
      <select id="uiLangSelect">
        <option value="zh-TW">Traditional Chinese</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <section class="short-url-hero" aria-labelledby="shortUrlTitle">
    <span class="short-url-eyebrow">SHARE WITHOUT CLUTTER</span>
    <h1 id="shortUrlTitle">Short URL</h1>
    <p id="shortUrlSubtitle">Create a compact link or share an image in seconds.</p>
  </section>

  <section class="short-url-workspace">
    <article class="short-url-card">
      <div class="short-url-card-heading">
        <span class="short-url-card-icon" aria-hidden="true">&#8599;</span>
        <div>
          <span id="shortLinkEyebrow" class="short-url-card-eyebrow">LINK</span>
          <h2 id="shortLinkTitle">Shorten a link</h2>
        </div>
      </div>

      <form id="shortUrlForm" class="short-url-form">
        <label class="short-url-field" for="targetUrl">
          <span id="targetUrlLabel">Destination URL</span>
          <input id="targetUrl" name="url" type="url" placeholder="https://example.com/path" required />
        </label>
        <label class="short-url-field" for="customCode">
          <span id="customCodeLabel">Custom code <em>(optional)</em></span>
          <input id="customCode" name="code" type="text" placeholder="my-link" maxlength="63" />
        </label>
        <button id="createShortUrlBtn" type="submit" class="short-url-submit short-url-submit--link">Create short URL</button>
      </form>

      <p id="errorText" class="short-url-error hidden" role="alert"></p>
      <section id="resultCard" class="short-url-result hidden" aria-live="polite">
        <div class="short-url-result-label" id="resultTitle">Your link</div>
        <a id="resultUrl" class="short-url-result-link" href="#" target="_blank" rel="noreferrer noopener"></a>
        <p class="short-url-result-meta"><span id="resultTargetLabel">Destination</span><span id="resultTarget"></span></p>
        <button id="copyShortUrlBtn" type="button" class="short-url-copy">Copy link</button>
      </section>
    </article>

    <article class="short-url-card short-url-card--image">
      <div class="short-url-card-heading">
        <span class="short-url-card-icon short-url-card-icon--image" aria-hidden="true">&#9670;</span>
        <div>
          <span class="short-url-card-eyebrow">IMAGE</span>
          <h2 id="imageShareTitle">Share an image</h2>
          <p id="imageShareSubtitle">Upload once and send a clean short link.</p>
        </div>
      </div>

      <form id="imageShareForm" class="short-url-form">
        <label class="short-url-upload" for="imageFile">
          <input id="imageFile" name="image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" required />
          <span class="short-url-upload-icon" aria-hidden="true">&#8593;</span>
          <span class="short-url-upload-copy">
            <strong id="imageFileLabel">Choose an image</strong>
            <small id="imageLimitHint">PNG, JPEG, GIF, and WebP up to 20 MB.</small>
          </span>
          <span id="imageFileName" class="short-url-upload-name"></span>
        </label>

        <div class="short-url-image-options">
          <div class="short-url-expiration">
            <label class="short-url-field" for="imageRetentionPreset">
              <span id="imageRetentionLabel">Expiration</span>
              <select id="imageRetentionPreset" name="retentionPreset">
                <option value="5" data-i18n="retention5Minutes">5 minutes</option>
                <option value="10" data-i18n="retention10Minutes">10 minutes</option>
                <option value="30" data-i18n="retention30Minutes">30 minutes</option>
                <option value="60" data-i18n="retention1Hour" selected>1 hour</option>
                <option value="180" data-i18n="retention3Hours">3 hours</option>
                <option value="360" data-i18n="retention6Hours">6 hours</option>
                <option value="720" data-i18n="retention12Hours">12 hours</option>
                <option value="1440" data-i18n="retention24Hours">24 hours</option>
                <option value="custom" data-i18n="retentionCustom">Custom expiration</option>
              </select>
              <small id="imageRetentionHint"></small>
            </label>
            <label id="imageCustomExpirationField" class="short-url-field hidden" for="imageCustomExpiration">
              <span id="imageCustomExpirationLabel">Custom expiration</span>
              <input id="imageCustomExpiration" name="expiresAt" type="datetime-local" step="60" />
              <small id="imageCustomExpirationHint"></small>
            </label>
          </div>
          <div class="short-url-protection">
            <label class="short-url-switch" for="imagePasswordProtected">
              <input id="imagePasswordProtected" name="passwordProtected" type="checkbox" />
              <span class="short-url-switch-track" aria-hidden="true"></span>
              <span id="imagePasswordProtectedLabel">Protect with password</span>
            </label>
            <label id="imagePasswordField" class="short-url-field hidden" for="imagePassword">
              <span id="imagePasswordLabel">Password</span>
              <input id="imagePassword" name="password" type="password" minlength="4" maxlength="128" />
              <small id="imagePasswordHint"></small>
            </label>
          </div>
        </div>

        <button id="createImageShareBtn" type="submit" class="short-url-submit short-url-submit--image">Create image link</button>
      </form>

      <p id="imageErrorText" class="short-url-error hidden" role="alert"></p>
      <section id="imageResultCard" class="short-url-result short-url-result--image hidden" aria-live="polite">
        <div class="short-url-result-label" id="imageResultTitle">Image link</div>
        <a id="imageResultUrl" class="short-url-result-link" href="#" target="_blank" rel="noreferrer noopener"></a>
        <p class="short-url-result-meta"><span id="imageExpiresLabel">Expires</span><span id="imageExpiresAt"></span></p>
        <button id="copyImageShareBtn" type="button" class="short-url-copy">Copy link</button>
      </section>
    </article>
  </section>
</main>
<script type="module" src="/web/short-url.js"></script>
</body>
</html>
