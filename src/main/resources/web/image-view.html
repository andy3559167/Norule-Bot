<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分享圖片 · NoRule URL</title>
  <link rel="stylesheet" href="/web/app.css" />
</head>
<body class="short-url-page image-view-page">
<main class="image-view-shell">
  <header class="image-view-header">
    <a class="short-url-brand" href="/" aria-label="NoRule URL home">
      <span class="short-url-brand-mark">N</span>
      <span>NoRule URL</span>
    </a>
    <a class="image-view-home" href="/">建立短網址</a>
  </header>

  <section class="image-view-intro">
    <div>
      <span class="short-url-eyebrow">SHARED IMAGE</span>
      <h1>分享圖片</h1>
      <p>由 NoRule URL 安全託管的圖片內容。</p>
    </div>
    <span class="image-view-status">__IMAGE_STATUS__</span>
  </section>

  <section class="image-view-layout">
    <figure class="image-view-stage">
      <img src="__IMAGE_CONTENT_URL__" alt="分享圖片 __IMAGE_CODE__" />
    </figure>

    <aside class="image-view-details" aria-label="圖片資訊">
      <div class="image-view-code">
        <span>短網址代碼</span>
        <strong>__IMAGE_CODE__</strong>
      </div>
      <dl class="image-view-stats">
        <div>
          <dt>瀏覽次數</dt>
          <dd>__IMAGE_VIEWS__</dd>
        </div>
        <div>
          <dt>到期時間</dt>
          <dd>__IMAGE_EXPIRES__</dd>
        </div>
        <div>
          <dt>圖片格式</dt>
          <dd>__IMAGE_TYPE__</dd>
        </div>
        <div>
          <dt>檔案大小</dt>
          <dd>__IMAGE_SIZE__</dd>
        </div>
      </dl>
      <p class="image-view-note">重新整理頁面會視為一次新的瀏覽。</p>
    </aside>
  </section>
</main>
</body>
</html>
